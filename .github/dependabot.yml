# Monthly, one grouped pull request per ecosystem; workflows/dependabot.yml merges it once its tests pass.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: gradle
    directory: /app
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      gradle:
        patterns: ['*']

  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: monthly
    groups:
      pip:
        patterns: ['*']
