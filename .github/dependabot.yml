# Monthly, one grouped pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: monthly
    groups:
      pip:
        patterns: ['*']
    ignore:
      # raised by hand together with the container image in tests.yml, which brings the matching Chromium
      - dependency-name: playwright
