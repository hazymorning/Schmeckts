# Monthly, one grouped pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: gradle
    directory: /app
    schedule:
      interval: monthly
    groups:
      gradle:
        patterns: ['*']

  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: monthly
    groups:
      pip:
        patterns: ['*']
