# Updates for everything the project pulls in from outside. Nothing here touches the app's own dependencies
# beyond opening a pull request; the tests decide whether it may be merged.
# One group per ecosystem, so a month's updates arrive as one pull request to read and merge rather than one
# per package: the first run without grouping opened seven at once.
version: 2
updates:
  # The workflows pin every foreign action to a commit; this is what raises the pin.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # Capacitor and its plugins, plus ESLint and Prettier (devDependencies in app/package.json)
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']

  # Pillow, Playwright and ruff, pinned exactly in tests/requirements.txt
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: monthly
    groups:
      pip:
        patterns: ['*']
    ignore:
      # Playwright is raised by hand. Its version decides which Chromium build is needed, and that build has to
      # be there in two places a bot does not touch: the container image in tests.yml and the ready-made browser
      # of Claude Code on the web (see .claude/hooks/session-start.sh). Raising only the package breaks both.
      - dependency-name: playwright
