# Updates for everything the project pulls in from outside. Dependabot only opens the pull request; whether it
# gets merged depends on the tests.
# One group per ecosystem, so a month's updates arrive as one pull request rather than one per package: the
# first run without grouping opened seven at once.
version: 2
updates:
  # The workflows pin every third-party action to a commit; this is what raises those pins.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # Capacitor and its plugins, plus ESLint and Prettier (devDependencies in app/package.json)
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']

  # Pillow, Playwright and ruff, pinned exactly in tests/requirements.txt
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: monthly
    groups:
      pip:
        patterns: ['*']
    ignore:
      # Playwright is raised by hand. Its version decides which Chromium build is needed, and that build comes
      # with the container image pinned in tests.yml, which no bot touches. Raising only the package leaves the
      # browser behind, and every suite that opens the app fails.
      - dependency-name: playwright
