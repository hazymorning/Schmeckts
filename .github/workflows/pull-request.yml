name: Pull request

# The title and the body of a pull request are read by people and are not in the repository, so lint.sh never
# sees them. This holds them to the same rules, and keeps more than one of our own pull requests from being
# open at a time: a month of them at once is work for whoever has to read them.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  text:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The title and the body
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$TITLE" | python3 scripts/text-style.py --stdin 'the title' --limit 72
          printf '%s' "$BODY" | python3 scripts/text-style.py --stdin 'the body' --limit 1200

      - name: One at a time
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ours=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json author \
            --jq '[.[] | select(.author.is_bot | not)] | length')
          [ "$ours" -le 1 ] || {
            echo "$ours pull requests of ours are open. Finish one before the next is opened." >&2
            exit 1
          }
