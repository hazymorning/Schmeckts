name: Dependabot

# A Dependabot pull request whose tests passed is merged, so updates need no one. Major Gradle updates are not
# proposed at all (dependabot.yml): they need work by hand.
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge the tested pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR="$(gh pr list --head "$BRANCH" --state open --json number,headRefOid,author \
            --jq '.[] | select(.author.login == "app/dependabot" and .headRefOid == env.SHA) | .number')"
          [ -n "$PR" ] || { echo "No open Dependabot pull request at $SHA."; exit 0; }
          gh pr merge "$PR" --merge --delete-branch --match-head-commit "$SHA"
