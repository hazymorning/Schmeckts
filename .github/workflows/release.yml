name: Release

# A published release gets the signed APK and the server packages attached once the tests are green. Started by
# hand, the same builds are left as artifacts.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          build-root-directory: app/android
          cache-read-only: ${{ github.event_name != 'release' }}

      - run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0" > /dev/null

      - name: Check the version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./app/package.json').version")"
          if [ -n "$TAG" ] && [ "${TAG#v}" != "$VERSION" ]; then
            echo "Tag $TAG does not match version $VERSION in app/package.json." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and sign
        env:
          SCHMECKTS_SIGNING_KEY: ${{ secrets.SCHMECKTS_SIGNING_KEY }}
        run: |
          [ -n "$SCHMECKTS_SIGNING_KEY" ] || { echo "The secret SCHMECKTS_SIGNING_KEY is missing." >&2; exit 1; }
          KEY_FILE="$RUNNER_TEMP/schmeckts-signing-key.txt"
          trap 'rm -f "$KEY_FILE"' EXIT INT TERM
          (umask 077; printf '%s' "$SCHMECKTS_SIGNING_KEY" > "$KEY_FILE")
          scripts/build-apk.sh "$KEY_FILE" --tested

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk
          path: dist/schmeckts-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false
      - run: server/build-deb.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server
          path: dist/schmeckts-server_*.deb
          if-no-files-found: error

  # Always as schmeckts.apk: the README links to releases/latest/download/schmeckts.apk.
  attach:
    if: github.event_name == 'release'
    needs: [tests, apk, server]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.apk.outputs.version }}
        run: |
          cp "schmeckts-$VERSION.apk" schmeckts.apk
          gh release upload "$TAG" schmeckts.apk schmeckts-server_*.deb --clobber --repo "$GITHUB_REPOSITORY"
