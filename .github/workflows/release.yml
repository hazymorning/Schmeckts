name: Release

# A published release gets the signed APK and the server packages attached once the tests are green. Started by
# hand, the same builds are left as artifacts; with publish they come out as the release of the version in
# app/gradle.properties, at the commit they were built from.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version in app/gradle.properties as the newest release
        type: boolean
        default: false
      notes:
        description: Release text; empty takes the version's news from the app
        type: string
        default: ''

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name != 'release' }}

      - run: scripts/setup-build-env.sh

      # a release that cannot build would stay the latest and leave the README's download link with nothing to find
      - name: Check the version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^version=//p' app/gradle.properties)"
          if [ -n "$TAG" ] && [ "${TAG#v}" != "$VERSION" ]; then
            echo "Tag $TAG does not match version $VERSION in app/gradle.properties; release and tag deleted." >&2
            gh release delete "$TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
            exit 1
          fi
          if [ "$PUBLISH" = true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Only main is published." >&2
            exit 1
          fi
          if [ "$PUBLISH" = true ] && gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$VERSION is out already; raise the version in app/gradle.properties first." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and sign
        env:
          SCHMECKTS_SIGNING_KEY: ${{ secrets.SCHMECKTS_SIGNING_KEY }}
        run: |
          [ -n "$SCHMECKTS_SIGNING_KEY" ] || { echo "The secret SCHMECKTS_SIGNING_KEY is missing." >&2; exit 1; }
          KEY_FILE="$RUNNER_TEMP/schmeckts-signing-key.txt"
          trap 'rm -f "$KEY_FILE"' EXIT INT TERM
          (umask 077; printf '%s' "$SCHMECKTS_SIGNING_KEY" > "$KEY_FILE")
          scripts/build-apk.sh "$KEY_FILE" --tested

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: dist/schmeckts-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false
      - run: server/build-deb.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server
          path: dist/schmeckts-server_*.deb
          if-no-files-found: error

  # Always as schmeckts.apk: the README links to releases/latest/download/schmeckts.apk.
  attach:
    if: github.event_name == 'release' || inputs.publish
    needs: [tests, apk, server]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || format('v{0}', needs.apk.outputs.version) }}
          VERSION: ${{ needs.apk.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          cp "schmeckts-$VERSION.apk" schmeckts.apk
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            gh release upload "$TAG" schmeckts.apk schmeckts-server_*.deb --clobber --repo "$GITHUB_REPOSITORY"
          else
            # a draft until its files are on it, so the newest release is never without the APK
            gh release create "$TAG" schmeckts.apk schmeckts-server_*.deb --draft --target "$GITHUB_SHA" --title "$TAG" \
              --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          fi

      # an empty release text gets the version's news from the app
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || format('v{0}', needs.apk.outputs.version) }}
          VERSION: ${{ needs.apk.outputs.version }}
        run: |
          [ -z "$(gh release view "$TAG" --json body --jq .body --repo "$GITHUB_REPOSITORY")" ] || exit 0
          NOTES="$(jq -r --arg v "$VERSION" '.[] | select(.v == $v) | .say + " " + .why' src/app/src/main/resources/news.json)"
          [ -z "$NOTES" ] || gh release edit "$TAG" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
