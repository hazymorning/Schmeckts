name: Release

# A published release builds the signed APK and attaches it. Started by hand the same path builds for
# trying things out, and the result is left as an artifact. Nothing is built without green tests:
# scripts/build-apk.sh runs the whole suite first.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # to attach the APK to the release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Python 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # The server uses the standard library only and there is no go.sum: no dependency cache.
      - name: Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache: false

      - name: JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      # Pillow draws the launcher icons for Android 7, Playwright drives Chromium for the interface tests.
      # The versions come from tests/requirements.txt, so a release is built against exactly what the tests ran on.
      - name: Pillow and Playwright with Chromium
        run: |
          python3 -m pip install --requirement tests/requirements.txt
          python3 -m playwright install --with-deps chromium

      # The runner's SDK lives in ANDROID_HOME and build-apk.sh takes it from there. What the build needs is
      # installed on top: platform 36 and the build tools, which is where apksigner and aapt2 come from.
      - name: Add to the Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0" > /dev/null

      # The version lives only in app/package.json; the release tag is v<version>.
      - name: Check the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./app/package.json').version")"
          if [ -n "$TAG" ] && [ "${TAG#v}" != "$VERSION" ]; then
            echo "Tag $TAG does not match version $VERSION in app/package.json. Expected v$VERSION." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # The signing key sits outside the working tree as a file for the duration of the build only, and is
      # removed in every case. It is never printed anywhere.
      - name: Build and sign the APK
        env:
          SCHMECKTS_SIGNING_KEY: ${{ secrets.SCHMECKTS_SIGNING_KEY }}
        run: |
          [ -n "$SCHMECKTS_SIGNING_KEY" ] || { echo "The secret SCHMECKTS_SIGNING_KEY is missing." >&2; exit 1; }
          KEY_FILE="$RUNNER_TEMP/schmeckts-signing-key.txt"
          trap 'rm -f "$KEY_FILE"' EXIT INT TERM
          (umask 077; printf '%s' "$SCHMECKTS_SIGNING_KEY" > "$KEY_FILE")
          scripts/build-apk.sh "$KEY_FILE"

      # Always under the same name: the README's download button links to releases/latest/download/schmeckts.apk.
      - name: Attach the APK to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp "dist/schmeckts-$VERSION.apk" dist/schmeckts.apk
          gh release upload "$TAG" dist/schmeckts.apk --clobber

      - name: Leave the APK as an artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: schmeckts-${{ env.VERSION }}
          path: dist/schmeckts-${{ env.VERSION }}.apk
          if-no-files-found: error
