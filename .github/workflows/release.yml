name: Release

# A published release builds the signed APK and attaches it. Started by hand the same path builds for trying
# things out, and the result is left as an artifact. Nothing is released without green tests: the whole suite
# runs as its own job (the Tests workflow, split across several) next to the build, and the APK is only
# attached once both are through.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # to attach the APK to the release

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Python 3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # Gradle keeps its downloads and its build cache between runs
      - name: Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          build-root-directory: app/android
          cache-read-only: ${{ github.event_name != 'release' }}

      # design/render-icons.py draws the launcher icons for Android 7 in Chromium, so this build needs a browser
      # as well. The browser is cached; only the system packages are fetched each time.
      - name: Chromium for the launcher icons
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tests/requirements.txt') }}
      - name: Pillow and Playwright
        run: |
          python3 -m pip install --requirement tests/requirements.txt
          python3 -m playwright install --with-deps chromium

      # The runner's SDK lives in ANDROID_HOME and build-apk.sh takes it from there. What the build needs is
      # installed on top: platform 36 and the build tools, which is where apksigner and aapt2 come from.
      - name: Add to the Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0" > /dev/null

      # The version lives only in app/package.json; the release tag is v<version>.
      - name: Check the version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./app/package.json').version")"
          if [ -n "$TAG" ] && [ "${TAG#v}" != "$VERSION" ]; then
            echo "Tag $TAG does not match version $VERSION in app/package.json. Expected v$VERSION." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The signing key sits outside the working tree as a file for the duration of the build only, and is
      # removed in every case. It is never printed anywhere. --tested: the tests run in the job beside this one.
      - name: Build and sign the APK
        env:
          SCHMECKTS_SIGNING_KEY: ${{ secrets.SCHMECKTS_SIGNING_KEY }}
        run: |
          [ -n "$SCHMECKTS_SIGNING_KEY" ] || { echo "The secret SCHMECKTS_SIGNING_KEY is missing." >&2; exit 1; }
          KEY_FILE="$RUNNER_TEMP/schmeckts-signing-key.txt"
          trap 'rm -f "$KEY_FILE"' EXIT INT TERM
          (umask 077; printf '%s' "$SCHMECKTS_SIGNING_KEY" > "$KEY_FILE")
          scripts/build-apk.sh "$KEY_FILE" --tested

      # Started by hand this is the result; for a release the job below picks it up again.
      - name: Leave the APK as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schmeckts-${{ steps.version.outputs.version }}
          path: dist/schmeckts-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

  # Always under the same name: the README's download button links to releases/latest/download/schmeckts.apk.
  attach:
    if: github.event_name == 'release'
    needs: [tests, apk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: schmeckts-${{ needs.apk.outputs.version }}
      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.apk.outputs.version }}
        run: |
          cp "schmeckts-$VERSION.apk" schmeckts.apk
          gh release upload "$TAG" schmeckts.apk --clobber --repo "$GITHUB_REPOSITORY"
