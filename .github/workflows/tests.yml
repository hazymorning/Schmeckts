name: Tests

# The whole suite on every push and every pull request, split across jobs that run at the same time, plus the
# style and mistake checks of scripts/lint.sh. Nothing is built here: no Android SDK, no APK, no .deb.
# Only what the tests actually need — no JDK either: ui_test.py only reads PhotoPlugin.java as text.
on:
  push:
  pull_request:
  workflow_call: # the release runs exactly these checks, and only attaches the APK once they are green

# A newer push to the same branch takes over from the one before it; on main every commit is checked in full.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The suites that open the app run in Playwright's own image: it already has the browser and its system
# packages, and "playwright install --with-deps" on every run was the slowest step of all. Its version follows
# the playwright pin in tests/requirements.txt, so the browser and the package always match.

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Python 3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache: false

      # ruff comes from the same pinned list as the test packages; shellcheck ships with the runner.
      - name: ruff
        run: python3 -m pip install --requirement tests/requirements.txt

      # ESLint, Prettier, gofmt, go vet, staticcheck, ruff and shellcheck. Every check runs, so one job
      # shows everything that is wrong.
      - name: Style and mistakes
        run: scripts/lint.sh

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The server uses the standard library only and there is no go.sum: no dependency cache.
      - name: Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache: false

      - name: Server tests
        run: scripts/test.sh go

  # The quick suites together: the pure modules in Node, storage, the design rules and the performance budget.
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/browser-tests
      - run: scripts/test.sh node storage design perf

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/browser-tests
      - run: scripts/test.sh ui

  # Several phones against the real server, so this one needs Go as well
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/browser-tests
      - name: Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache: false
      - run: scripts/test.sh sync
