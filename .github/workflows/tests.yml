name: Tests

# Bei jedem Push und jedem Pull Request die ganze Testsuite. Gebaut wird hier nichts:
# kein Android SDK, keine APK, kein .deb. Nur, was scripts/test.sh wirklich braucht.
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Der Server nutzt nur die Standardbibliothek, es gibt keine go.sum: kein Abhängigkeits-Cache.
      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Pillow erzeugt das Testfoto, Playwright fährt Chromium für die Tests der Oberfläche.
      - name: Playwright mit Chromium
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow playwright
          python3 -m playwright install --with-deps chromium

      # Holt zuerst die Schriften (prepare.py --nur-schriften), dann Go-, Node- und Chromium-Tests
      # samt Abgleich mehrerer Handys gegen den echten Server.
      - name: Testsuite
        run: scripts/test.sh
