name: Browser tests
description: >
  Installs what the suites that open the app in Chromium need: the Python packages, Node and the fonts.
  Meant to run inside Playwright's own image, which already has the browser and its system packages.

runs:
  using: composite
  steps:
    # The image has playwright itself; pillow and ruff come from the pinned list. --break-system-packages
    # because the image's Python is the system one (PEP 668) and nothing else uses it.
    - name: Python packages
      shell: bash
      run: python3 -m pip install --break-system-packages --requirement tests/requirements.txt

    - name: Node 22
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'

    # prepare.py downloads the fonts and checks each against a SHA-256: those checksums are the cache key, so
    # the cache stays valid until the fonts change.
    # The pins in this file are raised by hand: Dependabot reads .github/workflows, not composite actions.
    - name: Font checksums
      id: fonts
      shell: bash
      run: echo "key=$(grep -oE "'[0-9a-f]{64}'" scripts/prepare.py | tr -d "'\n")" >> "$GITHUB_OUTPUT"
    - name: Fonts
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: app/www/fonts/*.woff2
        key: fonts-${{ steps.fonts.outputs.key }}
