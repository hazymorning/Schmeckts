name: Browser tests
description: >
  Everything a suite needs that opens the app in Chromium: the Python packages, Node and the fonts.
  Meant to run inside Playwright's own image, which already brings the browser and its system packages.

runs:
  using: composite
  steps:
    # The image brings playwright itself; pillow and ruff come from the pinned list. --break-system-packages
    # because the image's Python is the system one (PEP 668); nothing else lives in it.
    - name: Python packages
      shell: bash
      run: python3 -m pip install --break-system-packages --requirement tests/requirements.txt

    - name: Node 22
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'

    # prepare.py downloads the fonts and checks each against a SHA-256: those checksums are the cache key, so
    # the cache keeps being used for as long as the fonts themselves do not change.
    - name: Font checksums
      id: fonts
      shell: bash
      run: echo "key=$(grep -oE "'[0-9a-f]{64}'" scripts/prepare.py | tr -d "'\n")" >> "$GITHUB_OUTPUT"
    - name: Fonts
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: app/www/fonts/*.woff2
        key: fonts-${{ steps.fonts.outputs.key }}
