name: Browser tests
description: Python packages and Node, inside Playwright's image. Dependabot does not raise pins in here.

runs:
  using: composite
  steps:
    - shell: bash
      run: python3 -m pip install --break-system-packages --requirement tests/requirements.txt

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
